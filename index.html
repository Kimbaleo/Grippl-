<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grippl</title>
<meta name="description" content="Per Knopfdruck a bayerisches Schimpfwort – mit Übersetzung für Preißn.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f8fa;
    --flaeche: #ffffff;
    --text: #14181f;
    --leise: #6b7280;
    --linie: #e5e7eb;
    --blau: #0060b0;
    --blau-hover: #004f91;
    --auf-blau: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216;
      --flaeche: #171b21;
      --text: #f1f3f5;
      --leise: #9aa3ad;
      --linie: #2a3038;
      --blau: #4a9be0;
      --blau-hover: #6aaeea;
      --auf-blau: #0b1a2b;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  header, footer {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    padding: 24px 20px;
    font-size: .875rem;
    color: var(--leise);
  }
  header strong {
    color: var(--text);
    font-weight: 800;
    letter-spacing: -.02em;
    font-size: 1rem;
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px 20px 40px;
  }

  .karte {
    width: 100%;
    max-width: 560px;
    background: var(--flaeche);
    border: 1px solid var(--linie);
    border-radius: 20px;
    padding: 40px 32px 32px;
  }

  .zitat {
    margin: 0 0 32px;
    font-size: .95rem;
    color: var(--leise);
  }
  .zitat::before { content: "„"; }
  .zitat::after  { content: "“"; }

  .ausgabe {
    min-height: 148px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    border-left: 3px solid var(--blau);
    padding: 4px 0 4px 20px;
    margin-bottom: 32px;
  }
  .fuer {
    margin: 0 0 6px;
    font-size: .8rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--leise);
  }
  .ausdruck {
    margin: 0;
    font-size: clamp(2rem, 8vw, 3rem);
    font-weight: 800;
    line-height: 1.08;
    letter-spacing: -.03em;
    overflow-wrap: anywhere;
  }
  .ausdruck.leer { color: var(--linie); }
  .ausdruck.neu { animation: rein .3s ease-out; }
  @keyframes rein {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }
  .preissn {
    margin: 10px 0 0;
    font-size: .9rem;
    color: var(--leise);
  }

  .zeile {
    display: flex;
    gap: 10px;
  }
  input {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 1rem;
    padding: 14px 16px;
    border: 1px solid var(--linie);
    border-radius: 12px;
    background: var(--bg);
    color: var(--text);
  }
  input::placeholder { color: var(--leise); }
  input:focus, button:focus-visible {
    outline: 2px solid var(--blau);
    outline-offset: 2px;
  }

  button {
    font: inherit;
    font-weight: 700;
    border: 0;
    border-radius: 12px;
    cursor: pointer;
  }
  .los {
    padding: 14px 24px;
    background: var(--blau);
    color: var(--auf-blau);
    transition: background .15s, transform .1s;
  }
  .los:hover { background: var(--blau-hover); }
  .los:active { transform: scale(.97); }

  .kopiern {
    margin-top: 14px;
    padding: 0;
    background: none;
    font-weight: 500;
    font-size: .875rem;
    color: var(--blau);
  }
  .kopiern[hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .ausdruck.neu { animation: none; }
    .los { transition: none; }
  }
  @media (max-width: 420px) {
    .karte { padding: 28px 20px 24px; }
    .zeile { flex-direction: column; }
  }
</style>
</head>
<body>
  <header>
    <strong>Grippl</strong>
    <span>Mia san mia.</span>
  </header>

  <main>
    <section class="karte">
      <p id="zitat" class="zitat">Schaun ma moi, dann seng ma scho.</p>

      <div class="ausgabe" aria-live="polite">
        <p id="fuer" class="fuer" hidden></p>
        <p id="ausdruck" class="ausdruck leer">Grantla</p>
        <p id="preissn" class="preissn">Druck auf'n Knopf.</p>
        <div><button id="kopiern" class="kopiern" type="button" hidden>Kopiern</button></div>
      </div>

      <div class="zeile">
        <input id="name" type="text" placeholder="Wer is dran?" aria-label="Name" autocomplete="off" maxlength="40">
        <button id="los" class="los" type="button">Schimpf!</button>
      </div>
    </section>
  </main>

  <footer>
    <span>Ois nur a Gaudi.</span>
    <span>Passt scho.</span>
  </footer>

<script>
  // Eigenschaftswörter: Stamm + Endung je nach Geschlecht (m: -a, w: -e, s: -s)
  const adjektive = [
    ["damisch", "dämlich"],
    ["bläd", "blöd"],
    ["greislich", "scheußlich"],
    ["hinterfotzig", "hinterhältig"],
    ["gscheart", "ungehobelt"],
    ["narrisch", "verrückt"],
    ["schiach", "hässlich"],
    ["letschert", "lasch"],
    ["gwampert", "dickbäuchig"],
    ["zaundürr", "spindeldürr"],
    ["ausgschamt", "unverschämt"],
    ["grantig", "schlecht gelaunt"],
    ["neidig", "neidisch"],
    ["hirnrissig", "hirnverbrannt"],
    ["rotzfrech", "frech"],
    ["verzogn", "unerzogen"],
    ["bsuffn", "betrunken"],
    ["oglatscht", "ungepflegt"],
    ["gschleckt", "geschniegelt"],
    ["gschupft", "überspannt"],
  ];

  // Hauptwörter mit Geschlecht und Übersetzung
  const hauptwoerter = [
    ["Depp", "m", "Dummkopf"],
    ["Hirnbaatzl", "m", "Hirnloser"],
    ["Grattler", "m", "Habenichts"],
    ["Bazi", "m", "Schlitzohr"],
    ["Haumdaucher", "m", "Rüpel"],
    ["Hornochs", "m", "Hornochse"],
    ["Schofsbeidl", "m", "Trottel"],
    ["Lackl", "m", "grober Kerl"],
    ["Doldi", "m", "Trottel"],
    ["Hanswurscht", "m", "Hanswurst"],
    ["Dampfplauderer", "m", "Schwätzer"],
    ["Gschaftlhuaba", "m", "Wichtigtuer"],
    ["Saubeidl", "m", "Mistkerl"],
    ["Rotzleffe", "m", "Rotzlöffel"],
    ["Bierdimpfe", "m", "Biertrinker ohne Hirn"],
    ["Hammeldepp", "m", "Volltrottel"],
    ["Krautschädl", "m", "Dickkopf"],
    ["Simpe", "m", "Einfaltspinsel"],
    ["Zwiderwurzn", "w", "Griesgram"],
    ["Ratschkathl", "w", "Tratschtante"],
    ["Bissgurkn", "w", "zänkische Person"],
    ["Funsn", "w", "eingebildete Ziege"],
    ["Trutschn", "w", "Trampel"],
    ["Schnepfn", "w", "dumme Gans"],
    ["Hupfdohln", "w", "Zappelphilipp"],
    ["Sumpfbiaschn", "w", "Kneipenhocker"],
    ["Rindviech", "s", "Rindvieh"],
    ["Gscheidhaferl", "s", "Besserwisser"],
    ["Mistviech", "s", "Mistvieh"],
    ["Krischperl", "s", "Schwächling"],
    ["Hascherl", "s", "armes Würstchen"],
    ["Fleischpflanzerl", "s", "Frikadelle"],
    ["Oaschgsicht", "s", "Arschgesicht"],
    ["Bürscherl", "s", "Bürschchen"],
  ];

  const endung = { m: "a", w: "e", s: "s" };

  // Bayerische Redewendungen, die oben wechseln
  const zitate = [
    "Schaun ma moi, dann seng ma scho.",
    "Wer ko, der ko.",
    "A bisserl wos geht oiwei.",
    "Des basst scho.",
    "Ned gschimpft is globt gnua.",
    "Do legst di nieda.",
    "Wos mi ned brennt, des blas i ned.",
    "Mia ham's ned eilig.",
    "Jetzt is scho wieder wos passiert.",
  ];

  const zufall = (liste) => liste[Math.floor(Math.random() * liste.length)];

  const el = (id) => document.getElementById(id);
  const ausdruckEl = el("ausdruck");
  const fuerEl = el("fuer");
  const preissnEl = el("preissn");
  const kopiernEl = el("kopiern");
  const zitatEl = el("zitat");
  const nameEl = el("name");
  let letzter = "", letztesZitat = zitatEl.textContent;

  function schimpf() {
    let ausdruck, adj, wort;
    do {
      adj = zufall(adjektive);
      wort = zufall(hauptwoerter);
      ausdruck = `${adj[0]}${endung[wort[1]]} ${wort[0]}`;
    } while (ausdruck === letzter);
    letzter = ausdruck;

    // Großschreibung am Anfang
    ausdruckEl.textContent = ausdruck[0].toUpperCase() + ausdruck.slice(1);
    ausdruckEl.classList.remove("leer", "neu");
    void ausdruckEl.offsetWidth; // Animation neu starten
    ausdruckEl.classList.add("neu");

    const name = nameEl.value.trim();
    fuerEl.hidden = !name;
    fuerEl.textContent = name ? `Für ${name}` : "";

    preissnEl.textContent = `Fürs Preißn: ${adj[1]} + ${wort[2]}`;
    kopiernEl.hidden = false;
    kopiernEl.textContent = "Kopiern";

    let z;
    do { z = zufall(zitate); } while (z === letztesZitat);
    zitatEl.textContent = letztesZitat = z;
  }

  el("los").addEventListener("click", schimpf);
  nameEl.addEventListener("keydown", (e) => { if (e.key === "Enter") schimpf(); });

  kopiernEl.addEventListener("click", async () => {
    const name = nameEl.value.trim();
    const text = name ? `${name}: ${ausdruckEl.textContent}` : ausdruckEl.textContent;
    try {
      await navigator.clipboard.writeText(text);
      kopiernEl.textContent = "Kopiert ✓";
    } catch {
      kopiernEl.textContent = "Ging ned – bitte händisch markiern";
    }
  });
</script>
</body>
</html>
